name: Build, Sign with SignPath, and Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-sign-release:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish .NET 10 Application
        run: |
          dotnet publish FreeRdpWrapper.csproj -c Release -f net10.0-windows10.0.19041.0 -r win-x64 --self-contained true -p:PublishSingleFile=true -o ./publish

      - name: Prepare Signing Payload
        shell: pwsh
        run: |
          # SignPath expects a zip containing the file(s) to sign
          New-Item -ItemType Directory -Path ./to_sign -Force
          Copy-Item ./publish/FreeRdpWrapper.exe ./to_sign/FreeRdpWrapper.exe
          Compress-Archive -Path ./to_sign/* -DestinationPath ./unsigned_payload.zip -Force

      - name: Submit Signing Request to SignPath
        shell: pwsh
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
        run: |
          Install-Module -Name SignPath -Force -Scope CurrentUser
          Import-Module SignPath

          Submit-SigningRequest `
            -InputArtifactPath "./unsigned_payload.zip" `
            -ApiToken $env:SIGNPATH_API_TOKEN `
            -OrganizationId "4133c782-e9a0-41bf-8180-f61656612c59" `
            -ProjectSlug "Freerdp_Wrapper" `
            -SigningPolicySlug "Freerdp_Wrapper_Signing_Policy" `
            -OutputArtifactPath "./signed_payload.zip" `
            -WaitForCompletion

      - name: Extract Signed Binary
        shell: pwsh
        run: |
          Expand-Archive -Path ./signed_payload.zip -DestinationPath ./signed_extracted -Force
          Copy-Item ./signed_extracted/FreeRdpWrapper.exe ./publish/FreeRdpWrapper.exe -Force

      - name: Assemble Release Package
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}"
          if ([string]::IsNullOrWhiteSpace($version) -or $version -notlike "v*") {
              $version = "v3.3.0"
          }

          $releaseDir = "./FreeRdpWrapper_Release"
          New-Item -ItemType Directory -Force -Path $releaseDir
          Copy-Item "./publish/FreeRdpWrapper.exe" -Destination $releaseDir -Force

          $binDir = "$releaseDir/Bin/FreeRDP"
          New-Item -ItemType Directory -Force -Path $binDir
          Copy-Item "./Bin/FreeRDP/Compiled/bin/*" -Destination $binDir -Recurse -Force

          $zipFile = "FreeRdpWrapper_${version}.zip"
          Compress-Archive -Path "$releaseDir/*" -DestinationPath $zipFile -Force
          echo "ZIP_PATH=$zipFile" >> $env:GITHUB_ENV

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          files: ${{ env.ZIP_PATH }}
          generate_release_notes: true
